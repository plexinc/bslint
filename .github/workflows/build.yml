name: build
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    # npm ci reads @plexinc packages, so do not rely on the repository
    # default, which an organization can tighten without warning.
    permissions:
      contents: read
      packages: read
    env:
      #hardcode the coveralls token...it's not overly important to protect, and github actions won't allow forks to work with coveralls otherwise
      COVERALLS_REPO_TOKEN: "xTzWrR5HfbescAFnSnVXmWsVVMYglUMZi"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18.20.4"
          architecture: 'x64' # fix for macos-latest
          registry-url: 'https://npm.pkg.github.com'
          scope: '@plexinc'
      - name: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test
      - run: npm run publish-coverage
